name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Create GitHub App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - name: Setup Git config
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          APP_USER="$APP_SLUG[bot]"
          APP_ID="$(gh api "/users/$APP_USER" --jq .id)"
          git config user.name "$APP_USER"
          git config user.email "$APP_ID+$APP_USER@users.noreply.github.com"
      - name: Setup Node.js
        uses: ./.github/actions/node
      - name: Install dependencies
        run: npm clean-install
      - name: Build the package
        run: npm run build
      - name: Release
        env:
          RELEASE_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_PR_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          IS_GITHUB_APP: "true"
        run: npx @release-change/cli --debug
